version: '3.8'

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: mera_postgres
    environment:
      POSTGRES_USER: mera_user
      POSTGRES_PASSWORD: mera_proyecto
      POSTGRES_DB: mera_advisor_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  neo4j:
    image: neo4j:latest
    container_name: mera_neo4j
    environment:
      NEO4J_AUTH: neo4j/mera_proyecto
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

volumes:
  pgdata:
  neo4j_data: